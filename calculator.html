<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title> Mexico Health Portal - Calculator </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body class="d-flex flex-column min-vh-100">
        <!-- Navbar -->
         <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
             <div class="container">
                <a class="navbar-brand" href="index.html">Mexico Health</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu"
                    aria-controls="navMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                 <span class="navbar-toggler-icon"></span>
                </button>

                 <div class="collapse navbar-collapse" id="navMenu">
                     <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mexico.html">Mexico</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="resources.html">Resources</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="calculator.html">Calculator</a>
                        </li>
                     </ul>
                 </div>
             </div>
         </nav>

     <main class="py-5 flex-grow-1">
        <div class="container">
            <section id="calculator" class="mb-5">
                <h2 class="mb-3">Calculator</h2>
                <p class="text-muted mb-4">Enter your weight (kg) and height (m). Example height: 1.70</p>

              <div class="row">
                <div class="col-md-6">
                  <div class="card">
                    <div class="card-body p-4">
                      <form id="bmi-form">
                        <div class="mb-3">
                          <label for="weight" class="form-label">Weight (kg)</label>
                          <input
                            type="number"
                            step="0.1"
                            class="form-control"
                            id="weight"
                            placeholder="E.g. 68"
                            required
                          />
                        </div>

                        <div class="mb-3">
                          <label for="height" class="form-label">Height (m)</label>
                          <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            id="height"
                            placeholder="E.g. 1.70"
                            required
                          />
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Calculate BMI</button>
                      </form>

                      <div id="result" class="mt-3"></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>  
        </div>
    </main>

    <footer class="py-3 bg-dark text-light mt-auto">
      <div class="container text-center">
        <small>&copy; 2026 Health Portal Mexico - Inspired by SDG 3</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    </body>
</html>
